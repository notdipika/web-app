<!-- Create a site that needs to have two buttons; one for adding an 
item into the list and another for removing the last item from the 
list. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic List</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>
    <h2>Dynamic List Controller</h2>

    <div id="controls">
        <button id="addBtn">Add Item</button>
        <button id="removeBtn">Remove Last Item</button>
    </div>

    <div id="inputSection">
        Type an item to insert into List: 
        <input type="text" id="itemInput" placeholder="Enter item">
        <button id="addInputBtn">ADD</button>
    </div>

    <ul id="itemList">
    </ul>

    <script src="1.js"></script>
</body>
</html>
