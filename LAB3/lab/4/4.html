<!-- Design and develop a simple interactive webpage that displays a 
light bulb image along with a control button. When the user clicks 
the button, the light bulb should toggle between ON and OFF 
states by changing its image dynamically. At the same time, a 
status message on the page should update to clearly indicate 
whether the bulb is currently ON or OFF. Additionally, the button 
text should change accordingly (for example, “Turn ON” when the 
bulb is OFF and “Turn OFF” when the bulb is ON). Implement the 
functionality using JavaScript to handle the click event and 
manipulate the DOM elements dynamically.  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Bulb</title>
    <link rel="stylesheet" href="4.css">
</head>
<body>
    <div class="container">
        <h2>Light Bulb Controller</h2>

        <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="Bulb">

        <p id="status">The bulb is OFF</p>

        <button id="toggleBtn">Turn ON</button>
    <script src="4.js"></script>
</div>
</body>
</html>
