<!-- Design and develop a simple webpage that contains a password 
input field along with a “Show / Hide” toggle button. When the user 
clicks the button, the password should dynamically switch between 
hidden (password type) and visible (text type). At the same time, 
the button text should update accordingly (e.g., display “Show” 
when the password is hidden and “Hide” when it is visible).   -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
    <link rel="stylesheet" href="5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">    
</head>
<body>
    <div class="container">
        <h2>Password Toggle</h2>

        <div class="input-box">
            <input type="password" id="password" placeholder="Enter password">
            <button id="toggleBtn">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>

        <p id="status">Password is Hidden</p>
    </div>
    <script src="5.js"></script>
</body>
</html>
