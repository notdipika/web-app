<!-- 2. Create a webpage that includes at least two hyperlinks using the <a> tag. One link should open in the same tab and the other should open in a new tab. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB1-2</title>
</head>
<body>
    <h1>Using Hyperlinks in HTML</h1>

    <p>
        Hyperlinks are created using the &lt;a&gt; tag in HTML.
        They allow users to move from one webpage to another by clicking on text or images.
    </p>

    <h2>Link Opening in the Same Tab</h2>
    <a href="https://www.wikipedia.org">
        Visit Wikipedia 
    </a>

    <br><br>

    <h2>Link Opening in a New Tab</h2>
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

</body>
</html>
